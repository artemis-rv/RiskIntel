# ══════════════════════════════════════════════════════════════════════════════
# nginx main configuration — runs entirely unprivileged
# ══════════════════════════════════════════════════════════════════════════════

worker_processes  auto;

# Writable by uid 101; the default /var/run/nginx.pid is not.
pid /var/run/nginx/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    # Deliberately omits the query string, cookies and the Authorization header.
    # Access logs are long-lived and widely readable, and a token that lands in
    # one is a token that has leaked (OWASP A09).
    log_format minimal '$remote_addr - "$request_method $uri" '
                       '$status $body_bytes_sent "$http_referer" rt=$request_time';
    access_log /dev/stdout minimal;

    # ── Transfer ──────────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;          # do not advertise the nginx version

    # Temp paths the nginx user can actually write.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # ── Compression ───────────────────────────────────────────────────────────
    # `gzip_proxied` excludes responses to authenticated requests. Compressing a
    # secret-bearing response that an attacker can partially influence is the
    # precondition for BREACH, and the download endpoint returns exactly that
    # kind of response.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      no-cache no-store private expired auth;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
