# ══════════════════════════════════════════════════════════════════════════════
# Security headers — included into EVERY location block
#
# WHY THIS IS A SEPARATE FILE
# nginx's add_header does not merge across levels. The moment a `location`
# block sets any add_header of its own, it discards every add_header inherited
# from the enclosing `server` block. So a server-level security policy plus one
# `location / { add_header Cache-Control ...; }` silently ships pages with NO
# security headers at all — which is exactly what the deployment verification
# caught here.
#
# Keeping them in one file and including it everywhere makes the policy
# impossible to lose by adding an unrelated header later.
#
# `always` sends these on error responses too, which are the responses an
# attacker is most interested in shaping.
# ══════════════════════════════════════════════════════════════════════════════

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# script-src carries no 'unsafe-inline' and no 'unsafe-eval': the bundle is
# entirely external files, which is what makes an injected <script> inert.
# style-src needs 'unsafe-inline' for Tailwind; removing it requires a nonce
# pipeline in the build, noted in the README.
# connect-src is 'self' because the API is proxied under this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
